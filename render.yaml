# Render Blueprint — https://render.com/docs/blueprint-spec
# Import via Render dashboard: New > Blueprint, point it at this repo.
#
# Client and server are two separate services on purpose: the static site never spins
# down (loads instantly, always), while the free API/Socket.io service still spins down
# after inactivity — the client shows its own loading screen while that wakes up instead
# of Render's default cold-start page.
#
# After the first blueprint sync, set the "sync: false" secrets below in the dashboard
# (they're intentionally left out of this file so nothing sensitive ends up in git).

services:
  - type: web
    name: donkeykaun
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build:server
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false # exact deployed client URL: https://donkeykaunloader.onrender.com
      - key: SITE_PASSCODE
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: ROOM_STATE_TTL_SECONDS
        value: "86400"
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_KEY_API_TOKEN
        sync: false
      - key: TURN_ENABLED
        sync: false # leave unset/false until production security checks pass
      - key: TURN_HOURLY_IP_LIMIT
        value: "30"
      - key: TURN_DAILY_CREDENTIAL_LIMIT
        value: "120"

  - type: web
    name: donkeykaunloader
    env: static
    rootDir: .
    buildCommand: npm install && npm run build:client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        sync: false # exact deployed API URL: https://donkeykaun.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), geolocation=(), payment=(), microphone=(self)
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://donkeykaun.onrender.com wss://donkeykaun.onrender.com; media-src 'self' blob:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
